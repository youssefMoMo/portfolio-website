<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Critical network hints — must precede all subresource requests ──── -->

    <!-- Google Fonts — two separate origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Supabase — replaced at build time by supabasePreconnectPlugin in vite.config.ts.
         If the plugin is not running, hard-code your project URL here instead:
           <link rel="preconnect" href="https://YOURREF.supabase.co" crossorigin />
    -->
    <!--SUPABASE_PRECONNECT_PLACEHOLDER-->

    <!-- Roblox Open-Cloud API -->
    <link rel="preconnect" href="https://apis.roblox.com" crossorigin />
    <link rel="dns-prefetch" href="https://thumbnails.roblox.com" />
    <link rel="dns-prefetch" href="https://www.roblox.com" />

    <link rel="dns-prefetch" href="https://vercel.live" />

    <!-- ── Fonts — display=swap for immediate first paint with fallback ────── -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ── Page meta ───────────────────────────────────────────────────────── -->
    <title>Youssef Design | Professional Roblox UI/UX Designer</title>
    <meta
      name="description"
      content="Youssef Design - Professional Roblox UI/UX Designer specializing in immersive game interfaces"
    />
    <meta name="keywords" content="Roblox, UI/UX, Game Design, Interface Design" />
    <meta name="author" content="Youssef Design" />
    <meta name="robots" content="index, follow" />

    <!-- ── Favicons ─────────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/png" href="/images/global/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0b0f" />

    <!-- ── Dark-mode flash prevention ──────────────────────────────────────── -->
    <!-- Runs synchronously before first paint — ensures `class="dark"` is
         always set on <html> before React mounts, preventing a white flash. -->
    <script>
      (function () {
        try {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
